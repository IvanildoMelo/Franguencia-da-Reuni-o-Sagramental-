<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo Pro</title>
    <style>
        /* Estilização Geral com Fundo de Nuvem */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Fundo com imagem de nuvens e sobreposição escura para leitura */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1534088568595-a066f410bcda?q=80&w=1951&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        /* Efeito de Vidro Espelhado (Glassmorphism) */
        .glass-container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
        }

        /* Tema: Título, Data e Hora */
        .app-header {
            margin-bottom: 20px;
        }

        .app-header h1 {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4ecca3;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        #current-date { font-size: 14px; opacity: 0.9; }
        #current-time { font-size: 28px; font-weight: bold; margin-top: 5px; }

        /* Barra de Busca */
        .search-box {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
        }

        input::placeholder { color: rgba(255, 255, 255, 0.7); }

        button {
            padding: 0 15px;
            border-radius: 12px;
            border: none;
            background: #4ecca3;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.05); background: #45b390; }

        /* Alerta de Chuva */
        #rain-alert {
            background: rgba(233, 69, 96, 0.85);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        /* Informações do Tempo */
        .weather-info h2 { font-size: 32px; margin-bottom: 5px; }
        #temp { font-size: 64px; font-weight: 200; margin: 10px 0; }
        #weather-description { text-transform: capitalize; font-size: 18px; margin-bottom: 20px; color: #bdc3c7; }
        
        #weather-icon {
            width: 100px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
        }

        /* Detalhes (Umidade e Vento) */
        .details {
            display: flex;
            justify-content: space-around;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .col { text-align: center; }
        .col p { font-size: 12px; color: #bdc3c7; margin-bottom: 5px; }
        .col span { font-size: 18px; font-weight: bold; }

        /* Animações */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="glass-container">
        <div class="app-header">
            <h1>Previsão do Tempo</h1>
            <div id="current-date">-- de -- de --</div>
            <div id="current-time">00:00:00</div>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Nome da cidade..." id="city-input">
            <button id="search-btn">🔍</button>
        </div>

        <div id="rain-alert" class="hidden">
            🌧️ Alerta: Chuva detectada! Leve guarda-chuva.
        </div>

        <div class="weather-content">
            <h2 id="city-name">Busque uma cidade</h2>
            <img src="https://openweathermap.org/img/wn/01d@2x.png" id="weather-icon" alt="clima">
            <h1 id="temp">--°C</h1>
            <p id="weather-description">---</p>

            <div class="details">
                <div class="col">
                    <p>Umidade</p>
                    <span id="humidity">0%</span>
                </div>
                <div class="col">
                    <p>Vento</p>
                    <span id="wind">0 km/h</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA E HORA ---
        function updateDateTime() {
            const now = new Date();
            const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('current-date').innerText = now.toLocaleDateString('pt-BR', dateOptions);
            document.getElementById('current-time').innerText = now.toLocaleTimeString('pt-BR');
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // --- LÓGICA DA API ---
        const apiKey = "f20a1103d48d2adb396794e1b4040754"; // << COLOQUE SUA CHAVE AQUI

        async function fetchWeather(city) {
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&lang=pt_br&appid=${apiKey}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.cod === "404") {
                    alert("Cidade não encontrada!");
                    return;
                }

                // Atualizar UI
                document.getElementById('city-name').innerText = data.name;
                document.getElementById('temp').innerText = Math.round(data.main.temp) + "°C";
                document.getElementById('weather-description').innerText = data.weather[0].description;
                document.getElementById('humidity').innerText = data.main.humidity + "%";
                document.getElementById('wind').innerText = (data.wind.speed * 3.6).toFixed(1) + " km/h";
                
                const icon = data.weather[0].icon;
                document.getElementById('weather-icon').src = `https://openweathermap.org/img/wn/${icon}@4x.png`;

                // Alerta de Chuva
                const rainAlert = document.getElementById('rain-alert');
                const mainWeather = data.weather[0].main.toLowerCase();
                
                if (mainWeather.includes("rain") || mainWeather.includes("drizzle") || mainWeather.includes("thunderstorm")) {
                    rainAlert.classList.remove('hidden');
                } else {
                    rainAlert.classList.add('hidden');
                }

            } catch (error) {
                console.error("Erro na busca:", error);
            }
        }

        // Eventos
        document.getElementById('search-btn').addEventListener('click', () => {
            const city = document.getElementById('city-input').value;
            if (city) fetchWeather(city);
        });

        document.getElementById('city-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const city = e.target.value;
                if (city) fetchWeather(city);
            }
        });
    </script>
</body>
</html>
